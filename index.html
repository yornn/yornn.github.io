<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yornn | Чертоги</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .profile-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 32px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #f0f6fc;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: #21262d;
            border-color: #8b949e;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">yornn</h1>
        <p class="profile-subtitle">Личная сокровищница и базы данных</p>

        <nav class="nav-menu">
            <a href="#" class="btn">🖼️ Промпты для картинок</a>
            <a href="#" class="btn">🎨 Стили</a>
            <a href="#" class="btn">👗 Наряды</a>
            <a href="#" class="btn">📝 Заметки</a>
        </nav>
    </div>

</body>
</html>
