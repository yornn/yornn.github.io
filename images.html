    <main class="content">
        <!-- Счётчик промптов: заполняется автоматически -->

        <!-- Ряд блоков промптов -->
        <div class="prompts-row">

        <!-- Блок промпта: наведение показывает кнопку, клик открывает на весь экран -->
        <section class="prompt-block">
            <div class="prompt-image" role="button" tabindex="0" title="нажми, чтобы раскрыть на весь экран">
                <img src="img-source/prompt-1.jpeg" alt="промпт 1">
                <!-- Всплывающая кнопка копирования (появляется при наведении) -->
                <button class="btn copy-btn hover-copy" type="button">копировать</button>
            </div>

            <!-- Скрытый текст промпта: копируется кнопкой и показывается в модалке -->
            <textarea class="prompt-text" readonly hidden>STYLE: 

SCENE: A continuous vertical two-panel composition, seamless transition, zero spacing, no borders, reading top to bottom, close-up profile shots framing heads and upper chests. Top section: anticipation of physical contact, gentle warm rim light, blurred indoor background. Bottom section: active physical contact, a small stylized floating heart icon in the upper negative space between the faces, soft amber ambient lighting.

FIGURE 1: Left side, taller stature. Top section: head tilted downward, soft subtle smile, relaxed posture. Bottom section: torso leaning forward downward, head lowered, lips pressed firmly flush against Figure 2's lips, overlapping facial silhouettes, establishing direct physical anchor point.

FIGURE 2: Right side, shorter stature. Top section: head tilted heavily backward, chin lifted, lips visibly puckered reaching upward, leaning forward into the empty space. Bottom section: eyelids softly closed, upward head angle maintained, lips securely locked against Figure 1's lips, absorbing the gentle physical pressure of the kiss.

FORMAT: 3/4</textarea>
        </section>

        <!-- Второй блок промпта -->
        <section class="prompt-block">
            <div class="prompt-image" role="button" tabindex="0" title="нажми, чтобы раскрыть на весь экран">
                <img src="img-source/prompt-2.jpeg" alt="промпт 2">
                <!-- Всплывающая кнопка копирования (появляется при наведении) -->
                <button class="btn copy-btn hover-copy" type="button">копировать</button>
            </div>

            <!-- Скрытый текст промпта: копируется кнопкой и показывается в модалке -->
            <textarea class="prompt-text" readonly hidden>STYLE: 

NEGATIVE STYLE: 3d render, octane render, plastic skin, photography, hyperrealism, harsh vector lines, flat cel shading, vibrant neon colors, glossy finish, sharp gradients, default anime style.

SCENE: A nostalgic scrapbook-inspired illustration with a dreamy vintage shōjo aesthetic. The composition resembles a handmade collage assembled from layered paper cutouts, lace, patterned paper, decorative washi tape, tiny bows, ribbons, heart stickers, pressed flowers, pearls, glitter accents, handwritten notes, stitched textures, scalloped frames, and delicate ornamental embellishments. The atmosphere is sweet, romantic, and unsettling at the same time, contrasting innocent decoration with silent obsession. 

COMPOSITION: Vertical composition. The layout is divided into two main elements. On the left side is a large lace-framed heart-shaped window acting like a scrapbook cutout. Inside this heart frame sits Figure 1, occupying roughly one third of the composition. Outside the heart frame, filling most of the right side, stands Figure 2, significantly larger in scale. The scrapbook decorations connect both parts of the composition with overlapping ribbons, hearts, lace trims, floral stickers, decorative tape strips, tiny sparkles, stitched borders, handwritten doodles, and layered paper textures. 

FIGURE 1: Figure 1 is completely confined within the heart-shaped scrapbook window. No part of Figure 1's body, limbs, shoulders, or silhouette extends beyond the decorative heart frame at any point. The heart-shaped opening functions like a small window into a separate space, and Figure 1 exists only inside it. Figure 1 leans slightly forward toward the edge of the heart frame as if quietly peeking out through a tiny window. Both hands gently rest on or lightly hold the decorative border of the frame. Figure 1 faces directly toward the viewer with a soft, shy smile, a faint blush, and relaxed body language. The pose is innocent, comfortable, and completely unaware of being watched. The figure appears to exist like a treasured memory sealed inside the scrapbook window, never visually overlapping or escaping beyond the heart-shaped frame. 

FIGURE 2: Figure 2 occupies most of the right side of the composition outside the heart-shaped frame. The torso faces directly toward the viewer, and the head remains pointed toward the camera with only a subtle sideways tilt, creating an unsettlingly gentle posture reminiscent of an affectionate admirer. The head does not turn toward the heart frame. Instead, only the eyes shift sharply sideways, staring intensely and unwaveringly at Figure 1. The expression is quietly obsessive: heavy-lidded eyes, a faint blush, a small awkward smile, and unmistakable lovestruck fascination. The body remains perfectly still and composed while only the sideways gaze reveals the fixation. Figure 2 never acknowledges the viewer—every ounce of attention is devoted to Figure 1 through the eyes alone.

BACKGROUND: The entire image is built as a richly layered scrapbook collage. The base consists of pastel paper textures decorated with tiny polka dots, gingham patterns, faded floral prints, and vintage stationery fragments. Numerous overlapping decorative elements fill every empty space without becoming cluttered. The composition is surrounded by ornate black lace borders, delicate ribbons, stitched paper edges, torn notebook scraps, decorative masking tape, vintage postage stamps, pressed flowers, tiny bows, pearl stickers, glossy hearts, hand-drawn doodles, miniature stars, sparkles, handwritten notes, floral cutouts, tiny envelopes, lace doilies, translucent stickers, and scattered confetti hearts. The heart-shaped frame surrounding Figure 2 is heavily decorated with lace, ribbons, scalloped paper edges, pearls, and miniature flowers, making it resemble a handmade scrapbook window. Small floating hearts, tiny bows, stitched lines, glitter stars, and soft decorative doodles are scattered throughout the page, visually connecting both figures. The overall color palette consists of muted reds, dusty pinks, warm cream tones, chocolate brown, ivory, faded burgundy, soft peach, and vintage beige, creating a warm retro aesthetic inspired by handmade greeting cards and nostalgic shoujo manga layouts. The illustration emphasizes layered paper textures, overlapping decorative elements, cut-out edges, printed fabrics, and handcrafted imperfections typical of physical scrapbooking. 

DEPTH: Strong layered collage effect. Decorative paper elements overlap one another with visible cut edges and soft paper shadows. Foreground ribbons, lace borders, stickers, and hearts partially overlap both figures, making them appear physically embedded into the scrapbook page rather than simply placed on top. The composition feels handcrafted with many stacked paper layers. 

LIGHTING: Soft, warm, slightly muted lighting with gentle pastel highlights. Vintage print colors with subtle paper texture, delicate film grain, low saturation, warm cream tones, dusty pinks, faded reds, and muted browns. Everything feels nostalgic and cozy despite the disturbing emotional contrast. 

MOOD: Innocent romance mixed with quiet obsession. Figure 1 radiates warmth, shyness, and sincerity, while Figure 2 silently watches with unmistakable infatuation. The contrast between the adorable scrapbook aesthetic and the unsettling one-sided gaze creates a psychological horror atmosphere hidden beneath an overwhelmingly cute presentation.</textarea>
        </section>

        <!-- Третий блок промпта -->
        <section class="prompt-block">
            <div class="prompt-image" role="button" tabindex="0" title="нажми, чтобы раскрыть на весь экран">
                <img src="img-source/prompt-3.jpeg" alt="промпт 3">
                <!-- Всплывающая кнопка копирования (появляется при наведении) -->
                <button class="btn copy-btn hover-copy" type="button">копировать</button>
            </div>

            <!-- Скрытый текст промпта: копируется кнопкой и показывается в модалке -->
            <textarea class="prompt-text" readonly hidden>STYLE: 


SCENE: Low angle. Square image. A slightly grainy illustration taken inside a car at night, capturing a moment that combines seriousness and subtle humor. The atmosphere is warm, with dim interior lighting creating soft shadows.


FIRST FIGURE (on foreground):
The first figure sits in the driver's seat by the car window. Seated in the front of the car, facing the camera. First figure is taking a selfie, holding the camera with an extended arm out of frame. First figure's head is turned to face the lens directly, holding a steady, upright posture. First figure has a calm, slightly deadpan expression.


SECOND FIGURE (on background):
The second figure leans over the first figure; the second figure's target is the window next to which the first figure is sitting. Initially, the second figure sits in the passenger seat, which is located off-screen; the figure reaches out from there. The torso and lower part of the second figure are tilted past the first figure, extending past it towards the window. Because of this deep, reaching lean, its lower half - specifically its hips and buttocks - is thrust prominently backward and elevated, dominating the right side of the illustration's foreground. The bottom of the second figure is located next to the chest of the first. Second figure's upper body is mostly obscured and turned away as figure leans its head and shoulders toward the open window.
The scene is set tightly within the passenger side of a dark car interior, with a leather headrest, dashboard elements, and a mirror visible in the blurry background. Through the open window on the right, the blurred lights and architecture of a nighttime environment, likely a food establishment (car pickup window), are hinted at, emphasizing the spatial relationship of ordering from the car.
The lighting is low and warm, focused on the figures within the car. Across the center a dark overlay bar with the white, centered text: "He wants to order." The low angle makes the contorted form of second figure appear massive and central. The focus is sharp on first figure face and the prominent buttocks of second figure.</textarea>
        </section>

        </div>
    </main>

    <!-- Модальное окно: промпт на весь экран -->
    <div class="prompt-modal" id="promptModal">
        <div class="modal-backdrop"></div>
        <button class="modal-arrow modal-prev" type="button" title="предыдущий промпт">❮</button>
        <button class="modal-arrow modal-next" type="button" title="следующий промпт">❯</button>
        <div class="modal-content">
            <div class="modal-image-wrap">
                <img class="modal-image" src="" alt="промпт">
            </div>
            <!-- Текст промпта заполняется динамически из блока -->
            <div class="modal-text-wrap"></div>
        </div>
    </div>

    <!-- Плавные переходы между страницами -->
    <script src="js/page-transition.js"></script>

    <script>
        // Обработчик копирования: текст берётся из textarea блока
        function attachCopyHandler(btn, textarea) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation(); // не открывать модалку при клике на кнопку

                navigator.clipboard.writeText(textarea.value).then(function () {
                    const oldLabel = btn.textContent;
                    btn.textContent = 'SKÅL!';
                    btn.classList.add('copied');
                    setTimeout(function () {
                        btn.textContent = oldLabel;
                        btn.classList.remove('copied');
                    }, 1500);
                });
            });
        }

        // Копирование для всех всплывающих кнопок
        document.querySelectorAll('.prompt-block').forEach(function (block) {
            const textarea = block.querySelector('.prompt-text');
            const hoverBtn = block.querySelector('.hover-copy');
            if (hoverBtn) attachCopyHandler(hoverBtn, textarea);
        });

        // Модальное окно: промпт на весь экран
        const modal = document.getElementById('promptModal');
        const modalImage = modal.querySelector('.modal-image');
        const modalTextWrap = modal.querySelector('.modal-text-wrap');
        const promptBlocks = Array.from(document.querySelectorAll('.prompt-block'));
        let currentIndex = -1;

        // Собирает текстовую плашку (подпись + поле + кнопка) из блока промпта
        function buildModalTexts(block, container) {
            container.innerHTML = '';

            const textarea = document.createElement('textarea');
            textarea.className = 'prompt-text modal-text';
            textarea.readOnly = true;
            textarea.value = block.querySelector('.prompt-text').value;
            container.appendChild(textarea);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'btn copy-btn modal-copy';
            copyBtn.type = 'button';
            copyBtn.textContent = 'копировать';
            attachCopyHandler(copyBtn, textarea);
            container.appendChild(copyBtn);
        }

        function showInModal(block) {
            const img = block.querySelector('.prompt-image img');

            modalImage.src = img.src;
            buildModalTexts(block, modalTextWrap);
            currentIndex = promptBlocks.indexOf(block);
        }

        function openModal(block) {
            showInModal(block);
            modal.classList.add('open');
            document.body.classList.add('modal-open');
            // Всегда начинаем с картинки на весь экран
            modal.querySelector('.modal-content').scrollTop = 0;
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        // Переключение между промптами (с зацикливанием)
        function showNext() {
            const next = (currentIndex + 1) % promptBlocks.length;
            showInModal(promptBlocks[next]);
        }

        function showPrev() {
            const prev = (currentIndex - 1 + promptBlocks.length) % promptBlocks.length;
            showInModal(promptBlocks[prev]);
        }

        modal.querySelector('.modal-next').addEventListener('click', showNext);
        modal.querySelector('.modal-prev').addEventListener('click', showPrev);

        // Открытие модалки по клику на картинку
        document.querySelectorAll('.prompt-image').forEach(function (img) {
            img.addEventListener('click', function () {
                openModal(img.closest('.prompt-block'));
            });
            img.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(img.closest('.prompt-block'));
                }
            });
        });

        // Колесико мыши по всей модалке: один поворот — переход к картинке или промпту,
        // где бы ни находился курсор
        const modalContent = modal.querySelector('.modal-content');
        let wheelCooldown = false;

        modal.addEventListener('wheel', function (e) {
            e.preventDefault();
            if (wheelCooldown) return;
            wheelCooldown = true;
            setTimeout(function () { wheelCooldown = false; }, 700); // защита от двойного срабатывания

            if (e.deltaY > 0) {
                // Вниз — к промпту
                modalTextWrap.scrollIntoView({ behavior: 'smooth' });
            } else {
                // Вверх — к картинке
                modalContent.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }, { passive: false });

        // Закрытие: клик по ЛЮБОМУ пустому месту модалки.
        // Не закрывают только: сама картинка, текст промпта, стрелки, кнопка копирования
        modal.addEventListener('click', function (e) {
            const keep = e.target.closest('.modal-image, .modal-text-wrap, .modal-arrow, .copy-btn');
            if (!keep) closeModal();
        });
        document.addEventListener('keydown', function (e) {
            if (!modal.classList.contains('open')) return;
            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowRight') {
                showNext();
            } else if (e.key === 'ArrowLeft') {
                showPrev();
            }
        });

        // Счётчик промптов: "2 ПРОМПТОВ" (с правильным склонением)
        // Ждём загрузки шрифта Norse, иначе на проде текст вставляется
        // до подгрузки шрифта и остаётся фолбэком
        (function updatePromptsCount() {
            const el = document.getElementById('promptsCount');
            function render() {
                const count = promptBlocks.length;
                const n = count % 10;
                const n100 = count % 100;
                let word = 'ПРОМПТОВ';
                if (n === 1 && n100 !== 11) word = 'ПРОМПТ';
                else if (n >= 2 && n <= 4 && (n100 < 12 || n100 > 14)) word = 'ПРОМПТА';
                el.textContent = count + ' ' + word;
                // Форсируем перерисовку, чтобы подхватился загруженный шрифт
                el.style.fontFamily = 'serif';
                void el.offsetWidth;
                el.style.fontFamily = "'Norse', serif";
            }

            if (document.fonts && document.fonts.load) {
                document.fonts.load('400 3rem Norse').then(render, render);
            } else {
                render();
            }

            // Страховка: перерисовать ещё раз после полной загрузки страницы
            window.addEventListener('load', render);
        })();
    </script>
