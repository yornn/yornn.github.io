                <!-- Плашка: основной промпт -->
                <span class="style-label">промпт</span>
                <textarea class="style-text" rows="8" readonly>Semi-realistic digital painting, WLOP inspired. Idealized but believable faces — smooth rendering, luminous skin, slightly softened features without cartoonish exaggeration. Painterly loose brushwork on background, tighter detail on faces and hands. Natural balanced color palette — neutral skin tones with healthy warmth, no color cast. Gentle shadows with natural color, not tinted blue or green. Skin reads as alive — subtle pinks on cheeks, ears, nose, knuckles. Muted but not desaturated. Shallow depth of field, intimate quiet mood.</textarea>

<img src="img-source/style-2-1.jpeg" alt="стиль">

            <!-- Скрытая часть: текст и кнопки -->

            <!-- Скрытая часть: текст и кнопки -->

    <!-- Модальное окно: стиль на весь экран -->
    <div class="style-modal" id="styleModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-image-wrap">
                <img class="modal-image" src="" alt="стиль">
            </div>
            <!-- Текстовые плашки заполняются динамически из блока стиля -->
            <div class="modal-text-wrap"></div>
        </div>
    </div>

    <!-- Плавные переходы между страницами -->
    <script src="js/page-transition.js"></script>

    <script>
        // Обработчик копирования текста из textarea над кнопкой
        function attachCopyHandler(btn) {
            btn.addEventListener('click', function () {
                const text = btn.previousElementSibling.value;

                navigator.clipboard.writeText(text).then(function () {
                    const oldLabel = btn.textContent;
                    btn.textContent = 'SKÅL!';
                    btn.classList.add('copied');
                    setTimeout(function () {
                        btn.textContent = oldLabel;
                        btn.classList.remove('copied');
                    }, 1500);
                });
            });
        }

        // Копирование для всех кнопок на странице
        document.querySelectorAll('.copy-btn').forEach(attachCopyHandler);

        // ============ Универсальная карусель картинок ============
        // Оборачивает img-элементы в трек, стрелки ‹ › и точки.
        // При наведении начинает медленно перелистываться сама.
        function initCarousel(container, opts) {
            const settings = Object.assign({
                delay: 1800,        // скорость автопрокрутки (мс)
                arrowsOnHover: true // стрелки только при наведении
            }, opts || {});

            const imgs = Array.from(container.querySelectorAll('img'));
            if (imgs.length === 0) return { show: function () {} };

            let dots = []; // точки-индикаторы (заполняются ниже)

            // Трек с кадрами
            const track = document.createElement('div');
            track.className = 'carousel-track';
            container.insertBefore(track, container.firstChild);
            imgs.forEach(function (im) { track.appendChild(im); });

            let idx = 0;
            let timer = null;

            function show(i) {
                idx = (i + imgs.length) % imgs.length;
                imgs.forEach(function (im, n) {
                    im.classList.toggle('active', n === idx);
                });
                dots.forEach(function (d, n) {
                    d.classList.toggle('active', n === idx);
                });
            }

            function startAuto() {
                if (imgs.length < 2 || timer) return;
                timer = setInterval(function () { show(idx + 1); }, settings.delay);
            }

            function stopAuto() {
                if (!timer) return;
                clearInterval(timer);
                timer = null;
            }

            // Элементы управления — только если картинок больше одной
            if (imgs.length > 1) {
                container.classList.add('has-carousel');

                // стрелки ‹ ›
                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-arrow carousel-prev';
                prevBtn.type = 'button';
                prevBtn.textContent = '‹';
                prevBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    show(idx - 1);
                });

                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-arrow carousel-next';
                nextBtn.type = 'button';
                nextBtn.textContent = '›';
                nextBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    show(idx + 1);
                });

                container.appendChild(prevBtn);
                container.appendChild(nextBtn);

                if (!settings.arrowsOnHover) {
                    container.classList.add('arrows-always');
                }

                // точки-индикаторы
                const dotsWrap = document.createElement('div');
                dotsWrap.className = 'carousel-dots';
                imgs.forEach(function (_, n) {
                    const dot = document.createElement('button');
                    dot.className = 'carousel-dot';
                    dot.type = 'button';
                    dot.addEventListener('click', function (e) {
                        e.stopPropagation();
                        show(n);
                    });
                    dotsWrap.appendChild(dot);
                    dots.push(dot);
                });
                container.appendChild(dotsWrap);

                // Автопрокрутка при наведении, остановка при уходе курсора
                container.addEventListener('mouseenter', startAuto);
                container.addEventListener('mouseleave', stopAuto);
            }

            show(0);
            return { show: show };
        }

        // Карусели в блоках стилей на странице
        document.querySelectorAll('.style-image').forEach(function (wrap) {
            initCarousel(wrap, { delay: 1800 });
        });

        // Модальное окно: стиль на весь экран
        const modal = document.getElementById('styleModal');
        const modalImage = modal.querySelector('.modal-image');
        const modalTextWrap = modal.querySelector('.modal-text-wrap');
        const styleBlocks = Array.from(document.querySelectorAll('.style-block'));
        let currentIndex = -1;

        // Собирает текстовые плашки (заголовок + линия + текст) из блока стиля
        function buildModalTexts(block, container) {
            container.innerHTML = '';

            const texts = Array.from(block.querySelectorAll('.style-text'));
            const styleNum = styleBlocks.indexOf(block) + 1;
            texts.forEach(function (text, i) {
                // Заголовок плашки: подпись слева, компактная кнопка справа
                const head = document.createElement('div');
                head.className = 'modal-text-head';

                // Подписи всегда: первая плашка — «стиль #N», вторая — «негатив»
                const labelEl = document.createElement('span');
                labelEl.className = 'style-label';
                labelEl.textContent = (i === 0) ? ('стиль #' + styleNum) : 'негатив';
                head.appendChild(labelEl);

                // Компактная кнопка копирования напротив заголовка
                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn copy-btn modal-copy';
                copyBtn.type = 'button';
                copyBtn.textContent = 'копировать';
                copyBtn.addEventListener('click', function () {
                    navigator.clipboard.writeText(textarea.value).then(function () {
                        const oldLabel = copyBtn.textContent;
                        copyBtn.textContent = 'SKÅL!';
                        copyBtn.classList.add('copied');
                        setTimeout(function () {
                            copyBtn.textContent = oldLabel;
                            copyBtn.classList.remove('copied');
                        }, 1500);
                    });
                });
                head.appendChild(copyBtn);

                container.appendChild(head);

                // Текст без подложки, прямо на общем блоке
                const textarea = document.createElement('textarea');
                textarea.className = 'style-text modal-text';
                textarea.rows = 4;
                textarea.readOnly = true;
                textarea.value = text.value;
                container.appendChild(textarea);

                // Растягиваем поле под весь текст — чтобы он помещался полностью
                requestAnimationFrame(function () {
                    textarea.style.height = 'auto';
                    textarea.style.height = textarea.scrollHeight + 'px';
                });
            });

            // Подсказка («nb pro» и т.п.) — в правом нижнем углу текста
            const hint = document.createElement('span');
            hint.className = 'modal-hint';
            hint.textContent = block.dataset.hint || '';
            container.appendChild(hint);
        }

        // Карусель внутри модалки: кадры текущего стиля, стрелки всегда видимы.
        // Автопрокрутка при наведении на картинку работает и здесь.
        const modalImageWrap = modal.querySelector('.modal-image-wrap');
        let modalCarousel = null;
        let modalImgs = [];

        function showInModal(block) {
            // Собираем карусель модалки из картинок выбранного стиля
            const srcs = Array.from(block.querySelectorAll('.style-image img'))
                .map(function (im) { return im.getAttribute('src'); });

            // очищаем предыдущую карусель
            modalImageWrap.innerHTML = '';
            modalImgs = srcs.map(function (src) {
                const im = document.createElement('img');
                im.className = 'modal-image';
                im.src = src;
                im.alt = 'стиль';
                modalImageWrap.appendChild(im);
                return im;
            });

            // текущий кадр = тот, что был виден в блоке на странице
            const activeIdx = Array.from(block.querySelectorAll('.style-image img'))
                .findIndex(function (im) { return im.classList.contains('active'); });

            modalCarousel = initCarousel(modalImageWrap, {
                delay: 1800,
                arrowsOnHover: false // в модалке стрелки видны всегда
            });
            modalCarousel.show(activeIdx >= 0 ? activeIdx : 0);

            buildModalTexts(block, modalTextWrap);
            currentIndex = styleBlocks.indexOf(block);
        }

        function openModal(block) {
            showInModal(block);
            modal.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        // Переключение между стилями (с зацикливанием)
        function showNext() {
            const next = (currentIndex + 1) % styleBlocks.length;
            showInModal(styleBlocks[next]);
        }

        function showPrev() {
            const prev = (currentIndex - 1 + styleBlocks.length) % styleBlocks.length;
            showInModal(styleBlocks[prev]);
        }

        // Открытие модалки по Enter/Space на картинке
        document.querySelectorAll('.style-image').forEach(function (img) {
            img.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(img.closest('.style-block'));
                }
            });
        });

        // Закрытие: клик по ЛЮБОМУ пустому месту модалки.
        // Не закрывают только: картинка с рамкой, тексты, стрелки карусели, кнопки копирования
        modal.addEventListener('click', function (e) {
            const keep = e.target.closest('.modal-image-wrap, .modal-text-wrap, .carousel-arrow, .carousel-dot, .copy-btn');
            if (!keep) closeModal();
        });

        // Клик по картинке в блоке: НЕ открывает модалку, если нажата стрелка/точка
        document.querySelectorAll('.style-image').forEach(function (img) {
            img.addEventListener('click', function (e) {
                if (e.target.closest('.carousel-arrow, .carousel-dot')) return;
                openModal(img.closest('.style-block'));
            });
        });
        document.addEventListener('keydown', function (e) {
            if (!modal.classList.contains('open')) return;
            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowRight') {
                showNext();
            } else if (e.key === 'ArrowLeft') {
                showPrev();
            }
        });
    </script>
